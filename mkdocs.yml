site_name: 意图驱动录制：AI 协同的自动化演示流水线
site_description: 从一台干净的机器开始，搭建一套"描述意图 + 少量 codegen"即可自动生成功能演示视频的完整流水线
site_url: https://idrp.bitey.ai/
repo_url: https://github.com/martinx/idrp-guide
repo_name: martinx/idrp-guide
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

plugins:
  - search

nav:
  - 首页: index.md
  - 第一部分 · 准备与基础:
      - "00 前言与总体架构": 00-overview.md
      - "01 环境准备": 01-environment-setup.md
      - "02 项目脚手架与目录规范": 02-project-scaffold.md
  - 第二部分 · 核心能力:
      - "03 一个功能点由哪几份文件描述": 03-feature-spec.md
      - "04 浏览器自动化与 Codegen": 04-codegen.md
      - "05 屏幕与浏览器录制": 05-recording.md
      - "06 录制之后：字幕与自然语速配音": 06-dubbing.md
      - "07 封面与素材生成": 07-cover-assets.md
      - "08 合成成片：裁剪/混流/烧字幕": 08-mixing.md
      - "09 命令行编排": 09-orchestrator.md
  - 第三部分 · 质量与运维:
      - "10 质量检查与防泄露清单": 10-quality-checklist.md
      - "11 故障排查、性能优化与扩展": 11-troubleshooting.md
      - "12 端到端实战演练": 12-walkthrough.md
      - "13 常见问题 FAQ": 13-faq.md
      - "14 自动化边界与 ROI 考量": 14-roi.md
      - "15 术语表与延伸阅读": 15-glossary.md
  - 第四部分 · AI 协同实战:
      - "16 AI 是真正的操作者": 16-ai-overview.md
      - "17 用 AI 设计与调试 Spec/Codegen": 17-ai-spec-and-codegen.md
      - "18 用 AI 生成解说文案与字幕": 18-ai-narration.md
      - "19 用 AI 做自动化质检与防泄露检测": 19-ai-qa-leak-detection.md
      - "20 反过来看：不用 AI 要多久": 20-ai-walkthrough.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/martinx/idrp-guide
